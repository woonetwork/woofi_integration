[workspace]
members = [
    "sdk",
    "client",
]
resolver = "2"

[net]
git-fetch-with-cli = true

[workspace.dependencies]
anchor-client = "0.29"
anchor-lang = "0.29"
anchor-spl = "0.29"
clap = { version = "3", features = [ "derive", "env" ] }
arrayref = "0.3.7"
spl-token = "=4.0.0"
solana-program = "=1.17.31"
solana-sdk = "=1.17.31"
solana-client = "=1.17.31"
solana-logger = "=1.17.31"
solana-rpc = "=1.17.31"
solana-zk-token-sdk = "=1.17.31"
solana-account-decoder = "=1.17.31"
jupiter-amm-interface = "=0.4.4"
anyhow = "1.0"
pyth-solana-receiver-sdk = "=0.3.1"
thiserror = "=1.0.65"
subtle = "=2.4.1"
paste = "1.0.15"
bincode = "1.3.3"
base64 = "0.13.1"
dotenv = "0.15.0"
tokio = { version = "1.14.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
woofi = { git= "ssh://git@github.com/woonetwork/WOOFi_Solana.git", rev = "d85dcd2b5eaa063399237e05f8b0d51ac3b61a81" }
woofi_sdk = { path = "sdk", features = ["no-entrypoint"] }
